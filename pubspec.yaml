name: art_front
description: ARThouse - Apartment Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0
  model_viewer_plus: ^1.7.0   # просмотр glTF/GLB ассетов
  vector_math: ^2.1.4          # матрицы/векторы для изометрии
  collection: ^1.18.0          # вспомогательные коллекции

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  fonts:
    - family: Gropled
      fonts:
        - asset: Gropled-Bold.otf
          weight: 700
    - family: NotoColorEmoji
      fonts:
        - asset: fonts/NotoColorEmoji.ttf
