name: art_front
description: ARTkhaus — маркетплейс ремонта с ИИ-прорабом, ТЗ и 3D
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.2
  webview_flutter_web: ^0.2.3+4
  webview_flutter_platform_interface: ^2.13.0
  model_viewer_plus: ^1.9.2
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - picture/
    - assets/data/work_price_catalog.json
  fonts:
    - family: Gropled
      fonts:
        - asset: Gropled-Bold.otf
          weight: 700
    - family: NotoColorEmoji
      fonts:
        - asset: fonts/NotoColorEmoji.ttf
