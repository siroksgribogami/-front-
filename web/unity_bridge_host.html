<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ARTHouse Unity Bridge</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1f2520;
      font-family: "Segoe UI", sans-serif;
      color: #f4efe4;
    }

    #bridge-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #3c4a3d, #1f2520 72%);
    }

    #bridge-status {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(16, 20, 17, 0.72);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
      font-size: 13px;
      line-height: 1.45;
    }

    #bridge-status.error {
      border: 1px solid rgba(222, 132, 106, 0.55);
      color: #ffd3c5;
    }
  </style>
</head>
<body>
  <div id="bridge-container">
    <div id="bridge-status">Мост Flutter–Unity загружается...</div>
  </div>

  <script>
    (function () {
      const flutterSource = 'arthouse-flutter-web';
      const unitySource = 'arthouse-unity-webgl';
      const gameObjectName = 'ARTHouseMapBridge';

      let unitySendMessage = null;
      let bridgeReady = false;
      let queuedCommands = [];
      const statusNode = document.getElementById('bridge-status');

      function notifyFlutter(message) {
        window.parent.postMessage(JSON.stringify({ source: unitySource, ...message }), '*');
      }

      function setStatus(message, isError) {
        statusNode.textContent = message;
        statusNode.className = isError ? 'error' : '';
      }

      function sendCommandToUnity(command) {
        if (unitySendMessage) {
          unitySendMessage(gameObjectName, command.method, command.argument || '');
        } else {
          queuedCommands.push(command);
        }
      }

      function flushQueue() {
        if (!unitySendMessage) return;
        const pending = queuedCommands.slice();
        queuedCommands = [];
        pending.forEach(sendCommandToUnity);
      }

      function handleFlutterMessage(message) {
        switch (message.type) {
          case 'initializeEditor':
            sendCommandToUnity({ method: 'ReceiveInitialMapJson', argument: message.payload || '' });
            break;
          case 'focusRoom':
            sendCommandToUnity({ method: 'FocusRoom', argument: message.roomId || '' });
            break;
          case 'showOverview':
            sendCommandToUnity({ method: 'ShowApartmentOverview', argument: message.payload || 'true' });
            break;
          case 'undo':
            sendCommandToUnity({ method: 'HandleUndoCommand', argument: '' });
            break;
          case 'redo':
            sendCommandToUnity({ method: 'HandleRedoCommand', argument: '' });
            break;
          case 'requestSnapshot':
            sendCommandToUnity({ method: 'RequestSnapshotForFlutter', argument: '' });
            break;
        }
      }

      window.addEventListener('message', function (event) {
        let data = event.data;
        if (typeof data !== 'string') return;
        try {
          data = JSON.parse(data);
        } catch (_) {
          return;
        }
        if (!data || data.source !== flutterSource) return;
        handleFlutterMessage(data);
      });

      window.ArthouseFlutterBridge = {
        notifyReady: function () {
          if (!bridgeReady) {
            bridgeReady = true;
            setStatus('Unity подключен через мост. Команды передаются в Unity.', false);
            notifyFlutter({ type: 'unityReady', message: 'Unity runtime готов и принимает команды.' });
          }
          flushQueue();
        },
        pushSnapshot: function (roomId, snapshotJson) {
          notifyFlutter({ type: 'snapshot', roomId: roomId || '', snapshotJson: snapshotJson || '' });
        },
        registerUnity: function (sendMessageFn) {
          if (typeof sendMessageFn === 'function') {
            unitySendMessage = sendMessageFn;
            flushQueue();
            if (!bridgeReady) {
              bridgeReady = true;
              setStatus('Unity зарегистрирован. Мост активен.', false);
              notifyFlutter({ type: 'unityReady', message: 'Unity зарегистрирован в мосте.' });
            }
          }
        }
      };

      setStatus('Мост Flutter–Unity активен. Unity не встроен в этот билд — подключите отдельно.', false);
      notifyFlutter({
        type: 'availability',
        available: true,
        message: 'Мост готов. Unity можно подключить через ArthouseFlutterBridge.registerUnity(sendMessage).'
      });
      notifyFlutter({
        type: 'unityReady',
        message: 'Мост готов. Flutter и Unity могут работать вместе при подключении Unity.'
      });
    })();
  </script>
</body>
</html>
